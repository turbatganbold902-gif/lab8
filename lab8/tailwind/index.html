
<!DOCTYPE html>
<html lang="mn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Миний зургийн цомог | Tailwind</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>

<body class="bg-slate-100 text-slate-800 transition-colors duration-300">

  <nav class="bg-indigo-700 text-white shadow-lg">
    <div class="mx-auto flex max-w-6xl items-center justify-between px-6 py-4">
      <a href="#" class="text-xl font-bold">Миний зургийн цомог</a>
      <button id="themeBtn"
        class="rounded-lg bg-white px-4 py-2 font-semibold text-indigo-700">
        Dark mode
      </button>
    </div>
  </nav>

  <main class="mx-auto max-w-6xl px-6 py-10">
    <h1 class="mb-3 text-center text-3xl font-bold">Миний зургийн цомог</h1>
    <p class="mb-8 text-center text-slate-500">
      Миний дуртай зураг, дурсамжууд
    </p>

    <section class="grid grid-cols-1 gap-6 sm:grid-cols-2 lg:grid-cols-3">

      <article class="overflow-hidden rounded-xl bg-white shadow-lg">
        <img src="../img/photo1.jpg" alt="Зураг 1"
          class="h-60 w-full cursor-pointer object-cover"
          onclick="openLightbox(this.src)">
        <div class="p-5">
          <h2 class="mb-2 text-xl font-bold">Зураг 1</h2>
          <p class="mb-4 text-slate-600">Миний дуртай зураг.</p>
          <button onclick="openLightbox('../img/photo1.jpg')"
            class="rounded-lg bg-indigo-600 px-4 py-2 text-white hover:bg-indigo-800">
            Томруулж харах
          </button>
        </div>
      </article>

      <article class="overflow-hidden rounded-xl bg-white shadow-lg">
        <img src="../img/photo2.jpg" alt="Зураг 2"
          class="h-60 w-full cursor-pointer object-cover"
          onclick="openLightbox(this.src)">
        <div class="p-5">
          <h2 class="mb-2 text-xl font-bold">Зураг 2</h2>
          <p class="mb-4 text-slate-600">Миний дурсамж.</p>
          <button onclick="openLightbox('../img/photo2.jpg')"
            class="rounded-lg bg-indigo-600 px-4 py-2 text-white hover:bg-indigo-800">
            Томруулж харах
          </button>
        </div>
      </article>

      <article class="overflow-hidden rounded-xl bg-white shadow-lg">
        <img src="../img/photo3.jpg" alt="Зураг 3"
          class="h-60 w-full cursor-pointer object-cover"
          onclick="openLightbox(this.src)">
        <div class="p-5">
          <h2 class="mb-2 text-xl font-bold">Зураг 3</h2>
          <p class="mb-4 text-slate-600">Шинэ дурсамж.</p>
          <button onclick="openLightbox('../img/photo3.jpg')"
            class="rounded-lg bg-indigo-600 px-4 py-2 text-white hover:bg-indigo-800">
            Томруулж харах
          </button>
        </div>
      </article>

    </section>

    <section class="mx-auto mt-12 max-w-xl rounded-xl bg-white p-6 shadow-lg">
      <h2 class="mb-4 text-2xl font-bold">Холбоо барих</h2>
      <form id="contactForm">
        <label for="email" class="mb-2 block font-medium">Имэйл хаяг</label>
        <input id="email" type="email" required
          placeholder="name@example.com"
          class="mb-4 w-full rounded-lg border border-slate-300 px-4 py-3">
        <button type="submit"
          class="rounded-lg bg-green-600 px-5 py-2 text-white hover:bg-green-700">
          Илгээх
        </button>
        <p id="formMessage" class="mt-3"></p>
      </form>
    </section>
  </main>

  <div id="lightbox"
    class="fixed inset-0 z-50 hidden items-center justify-center bg-black/90 p-6"
    onclick="closeLightbox()">
    <button class="absolute right-6 top-3 text-4xl text-white"
      aria-label="Хаах" onclick="closeLightbox()">×</button>
    <img id="lightboxImage" src="" alt="Томруулсан зураг"
      class="max-h-[85vh] max-w-full object-contain">
  </div>

</body>
</html>


<!DOCTYPE html>
<html lang="mn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Миний зургийн цомог | Bootstrap</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>

<body>
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
      <a class="navbar-brand fw-bold" href="#">Миний зургийн цомог</a>
      <button id="themeBtn" class="btn btn-outline-light">
        Dark mode
      </button>
    </div>
  </nav>

  <main class="container py-5">
    <h1 class="text-center fw-bold mb-3">Миний зургийн цомог</h1>
    <p class="text-center text-secondary mb-5">
      Миний дуртай зураг, дурсамжууд
    </p>

    <div class="row g-4">
      <div class="col-12 col-md-6 col-lg-4">
        <div class="card h-100 shadow-sm">
          <img src="../img/photo1.jpg" class="card-img-top gallery-img"
               alt="Зураг 1" onclick="openLightbox(this.src)">
          <div class="card-body">
            <h5 class="card-title">Зураг 1</h5>
            <p class="card-text">Миний дуртай зураг.</p>
            <button class="btn btn-primary"
                    onclick="openLightbox('../img/photo1.jpg')">
              Томруулж харах
            </button>
          </div>
        </div>
      </div>

      <div class="col-12 col-md-6 col-lg-4">
        <div class="card h-100 shadow-sm">
          <img src="../img/photo2.jpg" class="card-img-top gallery-img"
               alt="Зураг 2" onclick="openLightbox(this.src)">
          <div class="card-body">
            <h5 class="card-title">Зураг 2</h5>
            <p class="card-text">Миний дурсамж.</p>
            <button class="btn btn-primary"
                    onclick="openLightbox('../img/photo2.jpg')">
              Томруулж харах
            </button>
          </div>
        </div>
      </div>

      <div class="col-12 col-md-6 col-lg-4">
        <div class="card h-100 shadow-sm">
          <img src="../img/photo3.jpg" class="card-img-top gallery-img"
               alt="Зураг 3" onclick="openLightbox(this.src)">
          <div class="card-body">
            <h5 class="card-title">Зураг 3</h5>
            <p class="card-text">Шинэ дурсамж.</p>
            <button class="btn btn-primary"
                    onclick="openLightbox('../img/photo3.jpg')">
              Томруулж харах
            </button>
          </div>
        </div>
      </div>
    </div>

    <section class="mt-5 mx-auto" style="max-width: 600px">
      <h2 class="mb-3">Холбоо барих</h2>
      <form id="contactForm" novalidate>
        <label for="email" class="form-label">Имэйл хаяг</label>
        <input id="email" type="email" required
               class="form-control mb-3"
               placeholder="name@example.com">
        <div id="formMessage" class="mb-3"></div>
        <button type="submit" class="btn btn-success">Илгээх</button>
      </form>
    </section>
  </main>

  <div id="lightbox" class="lightbox"
       onclick="closeLightbox()">
    <button class="lightbox-close" aria-label="Хаах"
            onclick="closeLightbox()">×</button>
    <img id="lightboxImage" src="" alt="Томруулсан зураг">
  </div>
</body>
</html>
